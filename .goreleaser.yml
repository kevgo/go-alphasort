# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# more info at https://goreleaser.com
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: alphasort
    main: ./cmd/alphasort
    binary: alphasort
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.buildVersion={{.Version}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.xz]
    name_template: >-
      alphasort_
      {{- if eq .Os "darwin" }}macos{{ else }}{{ .Os }}{{ end }}_
      {{- if eq .Arch "amd64" }}intel{{ else }}arm{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  draft: false
  prerelease: auto
